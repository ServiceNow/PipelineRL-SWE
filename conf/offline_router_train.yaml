defaults:
  - base
  - _self_

output_dir: ???

offline_router:
  train:
    dataset_dir: ???
    model_path: Qwen/Qwen2.5-Coder-7B-Instruct
    mode: frozen_backbone  # representation_head only: frozen_backbone | full_backbone
    supervision_mode: representation_head  # representation_head | text_reward_vector | text_reward_scalar | text_reward_bin | text_reward_bin_delta | text_reward_output_bin | text_output_bin | text_pairwise_sign
    device: auto
    num_epochs: 10
    performance_value_hidden_dims:
      - 1024
      - 1024
    performance_value_activation: gelu
    log_every_steps: 100
    save_checkpoints: true
    batch_size: 1
    eval_batch_size: 1
    gradient_accumulation_steps: 1
    lr: 1.0e-4
    head_lr: 1.0e-4
    trunk_lr: 1.0e-5
    weight_decay: 0.0
    max_seq_length: 32000
    num_workers: 0
    bf16: true
    gradient_checkpointing: true
    shuffle_train: true
    train_sampling_strategy: random  # random | pairwise_sign_balanced_undersample | pairwise_sign_balanced_oversample
    max_train_rows: null
    max_eval_rows: null
    lora:
      task_type: CAUSAL_LM
      base_model_8bit: false
      base_model_4bit: false
      r: 16
      alpha: 32
      dropout: 0.05
      bias: none
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
    text_reward:
      target_precision: 2
      target_grid_count: null  # Set to 21 for the same 0.00, 0.05, ..., 1.00 grid as text_reward_bin.
      drop_overlength_rows: false
      lr: 5.0e-6
      weight_decay: 0.01
      warmup_steps: 100
      gradient_clipping: 0.3
      debug_step_logging: false
      max_new_tokens: 16
      do_sample: false
      parse_failure_value: 0.0
      clip_predictions: true
      bin_count: 21
      bin_label_prefix: " "
      bin_value_order: ascending  # ascending: A=0.00,...; descending: A=1.00,...
      delta_aux_weight: 0.0  # text_reward_bin_delta only
      delta_aux_huber_delta: 0.05  # text_reward_bin_delta only
    text_output:
      bin_count: 21
      bin_label_prefix: " "
      max_value: 6000.0
      value_scale: linear  # linear | log1p
      clip_predictions: true
      loss_weight: 1.0
    text_pairwise:
      tie_margin: 0.05
      label_prefix: " "
      primary_better_label: A
      expert_better_label: B
    utility:
      enabled: true
      lambdas:
        - 0.0
        - 1.0e-5
        - 2.0e-5
        - 5.0e-5
        - 1.0e-4
        - 2.0e-4
