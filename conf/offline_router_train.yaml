defaults:
  - base
  - _self_

output_dir: ???

offline_router:
  train:
    dataset_dir: ???
    model_path: Qwen/Qwen2.5-Coder-7B-Instruct
    mode: frozen_backbone  # representation_head only: frozen_backbone | full_backbone
    supervision_mode: representation_head  # representation_head | text_reward_vector
    device: auto
    num_epochs: 10
    performance_value_hidden_dims:
      - 1024
      - 1024
    performance_value_activation: gelu
    log_every_steps: 100
    save_checkpoints: true
    batch_size: 1
    eval_batch_size: 1
    gradient_accumulation_steps: 1
    lr: 1.0e-4
    head_lr: 1.0e-4
    trunk_lr: 1.0e-5
    weight_decay: 0.0
    max_seq_length: 32000
    num_workers: 0
    bf16: true
    gradient_checkpointing: true
    shuffle_train: true
    max_train_rows: null
    max_eval_rows: null
    lora:
      task_type: CAUSAL_LM
      base_model_8bit: false
      base_model_4bit: false
      r: 16
      alpha: 32
      dropout: 0.05
      bias: none
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
    text_reward:
      target_precision: 2
      lr: 5.0e-6
      weight_decay: 0.01
      warmup_steps: 100
      gradient_clipping: 0.3
      debug_step_logging: false
      max_new_tokens: 16
      do_sample: false
      parse_failure_value: 0.0
      clip_predictions: true
