defaults:
  - base
  - override finetune: ppo
  - _self_

# Override the rollout policy for localization
actor:
  rollout_policy: pipelinerl.swe.rollouts.pipeline.generate_unified_swe_rollout
  log_each_n_secs: 10
  llm_max_rollouts: 64
  rollout_workers: 1
  discount_factor: 1
  task_template: "{task}"
  throughput_window_size: 50
  success_threshold: 0.8  # For repair stage

# Use SWE dataset loader
dataset_loader: pipelinerl.swe.load_datasets.load_local_swe_dataset
train_dataset_names:
  - swe_smith_train
test_dataset_names:
  - swe_smith_test

# Agent-specific settings
agent:
  max_prompt_length: 48000
  selection_max_prompt_length: 48000
  repair_max_prompt_length: 48000

# Finetune settings optimized for localization
finetune:
  seq_parallel: 2
  seq_length: 32000
  gradient_accumulation_passes: 512  # Adjust based on your setup
  rl:
    temperature: ${...llm.parameters.temperature}
    performance_value_loss_coef: 0.05
    performance_value_dynamic_scale: true
    performance_value_dynamic_max_multiplier: 0

# LLM settings for localization
llm:
  parameters:
    max_tokens: 2000  # Short outputs for search queries
    temperature: 1.0

# Policy vLLM settings (override base max_model_len=10000)
vllm_config:
  vllm_kwargs:
    max_model_len: 32000

test_llm:
  parameters:
    max_tokens: 2000
    temperature: 0.8  # Slightly lower for more focused queries during eval

# Environment is not needed for localization
environment: null

# SWE-specific dataset parameters
dataset_loader_params:
  dataset_path: /mnt/llmd/data/swe_smith/ds_train
  test_dataset_path: /mnt/llmd/data/swe_smith/ds_test
  test_max_samples: 500

# Model path - use a coding-focused model if available
model_path: Qwen/Qwen2.5-Coder-7B-Instruct

# Evaluation settings
eval_every_n_versions: 10000

swe:
  # Stage enablement flags
  enable_localization: false
  enable_file_selection: false
  enable_repair: true
  
  # Run flags (for stages that contribute to training data)
  run_localization: false
  run_file_selection: false
  run_repair: true
  
  # Expert model reward regression
  enable_expert_reward: true
  
  expert_models:
    - expert_rank: 0
      model_name: "mistralai/Devstral-Small-2505"
      tokenizer_name: ${model_path}
      parameters:
        max_tokens: 15000
        temperature: 1.0
      timeout: 300
      max_retries: 3
    - expert_rank: 1
      model_name: "openai/gpt-oss-120b"
      tokenizer_name: ${model_path}
      parameters:
        max_tokens: 15000
        temperature: 0.7
      timeout: 300
      max_retries: 3
  
  # Repository paths
  repo_path_default: /mnt/llmd/data/swe_smith/repos

  abstain:
    quality_threshold: null
    handoff_margin: 0.0

  router_trace:
    enabled: true
    include_outputs: true
    include_policy_token_ids: false
    include_file_contents: false
  

swe_preprocessor_args:
  repo_path: /mnt/llmd/data/swe_smith/repos
  dataset_path: /mnt/llmd/data/swe_smith/ds_train
  min_token_threshold: 10
  max_token_threshold: 5000
  num_map_processes: 32
  tokenizer_model: Qwen/Qwen2.5-Coder-7B-Instruct
  force_reprocess: false
  hf_dataset_name: SWE-bench/SWE-smith-py
  hf_split_name: train

world:
  expert_llms:
    - enabled: true
      model_path: mistralai/Devstral-Small-2505
      port: 8280
      # Optional: run expert server in a different conda env.
      conda_env: vllm-env
      vllm_kwargs:
        tensor-parallel-size: 1
        tokenizer_mode: mistral
        config_format: mistral
        load_format: mistral
        max_model_len: 32000
    - enabled: true
      conda_env: vllm-env
      model_path: openai/gpt-oss-120b
      port: 8380
      vllm_kwargs:
        tensor-parallel-size: 4
        max_model_len: 32000
  replicas: 1
  env_replicas: 1
  fixed_gpus:
    actor: 5
    preprocessor: 0
    finetune: 6
    expert: 5
