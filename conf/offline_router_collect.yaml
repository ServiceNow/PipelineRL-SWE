defaults:
  - base
  - _self_

output_dir: ???

offline_router:
  launch:
    healthcheck_timeout_s: 1800
    healthcheck_poll_s: 10

  dataset:
    loader: pipelinerl.swe.load_datasets.load_local_swe_dataset
    train_dataset_names:
      - swe_smith_train
    train_dataset_path: /mnt/llmd/data/swe_smith/ds_train
    train_dataset_label: null
    train_max_samples: null
    eval_dataset_names:
      - swebench_lite
    eval_dataset_path: /mnt/llmd/data/swebench_lite/ds
    eval_dataset_label: null
    eval_max_samples: 500

  primary_model:
    label: primary_model
    model_path: /mnt/llmd/results/exps/aristides/reason/swe_smith_policy_conditioned_no_devstral_1773812579/finetune/current
    served_model_name: primary_model
    model_name: ${.served_model_name}
    tokenizer_name: Qwen/Qwen2.5-Coder-7B-Instruct
    base_url: null
    conda_env: vllm-env
    port: 8000
    parameters:
      max_tokens: 2000
      temperature: 1.0
    vllm_kwargs:
      dtype: bfloat16
      tensor-parallel-size: 1
      pipeline-parallel-size: 1
      gpu-memory-utilization: 0.9
      max_model_len: 32000

  experts:
    - expert_rank: 0
      label: expert_0:mistralai/Devstral-Small-2505
      model_path: mistralai/Devstral-Small-2505
      served_model_name: expert_0
      model_name: ${.served_model_name}
      base_url: null
      conda_env: vllm-env
      port: 8280
      parameters:
        max_tokens: 15000
        temperature: 0.15
      vllm_kwargs:
        tensor-parallel-size: 1
        tokenizer_mode: mistral
        config_format: mistral
        load_format: mistral
        max_model_len: 32000
    - expert_rank: 1
      label: expert_1:openai/gpt-oss-120b
      model_path: openai/gpt-oss-120b
      served_model_name: expert_1
      model_name: ${.served_model_name}
      base_url: null
      conda_env: vllm-env
      port: 8380
      parameters:
        max_tokens: 15000
        temperature: 0.7
      vllm_kwargs:
        tensor-parallel-size: 4
        max_model_len: 32000

  collection:
    collect_train: true
    collect_eval: true
    shuffle: false
    shard_size: 64
    progress_log_every: 25
    max_concurrent_problems: 32
    connector_limit: 128
    request_timeout: 1800
    success_threshold: 0.8

  expert_base_urls: []
